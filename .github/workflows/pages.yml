# Builds and publishes the site. Every push to main regenerates the pages from
# manuscript/ and rebuilds the downloads here, on GitHub's runner, so nothing
# generated has to live in git. Settings, Pages, Source must be "GitHub Actions"
# for this to be what the world sees.
#
# One job rather than the usual build-then-deploy pair, because a second job
# means a second runner to start for the sake of a ten-second step.
name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # pandoc builds the downloads, typst makes the PDF. Both are single pinned
      # binaries: seconds, where a TeX installation is a quarter of a gigabyte
      # and a minute or two. Same versions every run, so the PDF doesn't change
      # under you. If the PDF fails anyway, make-downloads.sh says so and leaves
      # it off the Downloads page rather than failing the build.
      - name: Install pandoc and typst
        env:
          PANDOC_VERSION: 3.8.2.1
          TYPST_VERSION: 0.15.1
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          sudo dpkg --install /tmp/pandoc.deb
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar --extract --xz --strip-components=1 --directory=/usr/local/bin \
              typst-x86_64-unknown-linux-musl/typst
          # Charis SIL is Charter's descendant, and the closest to it that
          # Ubuntu packages. Without it typst falls back to its built-in face
          # and the type reads smaller.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-sil-charis
          pandoc --version | head -1
          typst --version
          typst fonts | grep -i charis

      - name: Generate the pages and the downloads
        run: |
          ./llms/claude-2026-08/publish.sh
          ./llms/claude-2026-08/check-orphans.sh
          ./llms/claude-2026-08/make-downloads.sh

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
