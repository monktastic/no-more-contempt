title: No More Contempt
description: A book about contempt, in progress.
url: "https://www.nomorecontempt.org"
baseurl: ""
email: akprasad@gmail.com

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

# just-the-docs
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
color_scheme: light
aux_links:
  "Source": "https://github.com/monktastic/no-more-contempt"
footer_content: "A draft, changing often. Tell me where it fails."

# Only the generated site pages are published. Everything else in the repo is
# working material.
exclude:
  - llms/
  - old/
  - scratch/
  - chapters/
  - _posts/
  - _site/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - "*.txt"
  - "*.sh"
  - "The Harm Paradox.md"
  - Untitled.md
  - about.markdown
  - alt.md
  - book.md
  - faq.md
  - invitiation-to-darkness.md
  - misc-notes.md
  - psychedelics.md
  - quotes.md
  - short-2.md
  - short-summary.md
  - short.md
  - test.md
  - unity.md
  - README.md
